<title>Ficha Hpt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: coluna única de celular (máx. 560px). Ficha de academia: letras grandes condensadas
   como etiqueta de anilha, séries em linhas tabulares, barra de descanso fixa embaixo. */
:root {
  --bg: #e9ecef;
  --surface: #f8f9fa;
  --ink: #141a21;
  --muted: #5b6672;
  --line: #d3d8de;
  --accent: #1d58c9;      /* azul de anilha de 20 kg */
  --accent-ink: #ffffff;
  --accent-soft: #dbe5f8;
  --done: #1f8a4c;
  --done-soft: #d9efe1;
  --warn: #b5541c;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1318; --surface: #181e25; --ink: #e8ecf0; --muted: #94a0ad; --line: #2a333d;
    --accent: #5b8ff0; --accent-ink: #0b1220; --accent-soft: #1b2a45;
    --done: #45c07a; --done-soft: #16301f; --warn: #e48a52; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1318; --surface: #181e25; --ink: #e8ecf0; --muted: #94a0ad; --line: #2a333d;
  --accent: #5b8ff0; --accent-ink: #0b1220; --accent-soft: #1b2a45;
  --done: #45c07a; --done-soft: #16301f; --warn: #e48a52; color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; margin: 0; }
#app { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 140px; display: grid; gap: 16px; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; margin: 0; line-height: 1.05; text-wrap: balance; }
h1 { font-size: 34px; letter-spacing: .01em; }
h2 { font-size: 22px; }
.muted { color: var(--muted); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 10px 16px; font-weight: 600; min-height: 44px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--warn); border-color: currentColor; background: transparent; }
.btn.small { min-height: 34px; padding: 6px 12px; font-size: 13.5px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.spread { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.icon { width: 18px; height: 18px; flex: none; }

/* Cabeçalho do plano */
.plano { display: grid; gap: 6px; padding-top: 8px; }
.plano .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: 13.5px; }

/* Lista de treinos */
.treinos { display: grid; gap: 10px; }
.treino-card { display: grid; grid-template-columns: 64px 1fr auto; gap: 14px; align-items: center; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px 12px 12px; }
.letra { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 34px; background: var(--bg); border: 3px solid var(--ink); }
.treino-card.proximo .letra { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.treino-card .nome { font-family: var(--font-display); font-size: 21px; font-weight: 600; }
.treino-card .resumo { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.treino-card .info { min-width: 0; display: grid; gap: 2px; }
.campo { width: 100%; height: 48px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 0 12px; font-size: 17px; }
.campo:focus { border-color: var(--accent); outline: none; }
.chip { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.chip.ok { background: var(--done-soft); color: var(--done); }
.chev { color: var(--muted); }

/* Painel de importação / dados */
.painel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 12px; }
.painel p { margin: 0; font-size: 14px; }
.aviso { border-color: var(--accent); background: var(--accent-soft); }
.erro { border-color: var(--warn); color: var(--warn); }
.preview-list { margin: 0; padding-left: 18px; font-size: 14px; }

/* Tela do treino */
.topo { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); margin-inline: -16px; padding: 10px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.barra { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.barra > i { display: block; height: 100%; background: var(--done); transition: width .25s; }
.voltar { border: 0; background: none; padding: 6px 4px; display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-weight: 600; min-height: 40px; }

.ex { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; }
.ex.completo { border-color: var(--done); }
.ex h3 { font-size: 20px; font-weight: 600; }
.ex .prescricao { font-size: 13.5px; color: var(--muted); display: grid; gap: 2px; }
.ex .prescricao b { color: var(--ink); font-weight: 600; }
.instr { font-size: 13.5px; background: var(--bg); border-radius: 8px; padding: 8px 10px; }
.grupo { border: 2px dashed var(--accent); border-radius: calc(var(--r) + 4px); padding: 10px; display: grid; gap: 10px; }
.grupo-tag { display: flex; align-items: center; gap: 8px; color: var(--accent); font-weight: 600; font-size: 13.5px; }

.sets { display: grid; gap: 6px; }
.set { display: grid; grid-template-columns: 26px 1fr 112px 44px; gap: 8px; align-items: center; padding: 4px 0; }
.set .n { font-family: var(--font-display); font-weight: 700; font-size: 18px; color: var(--muted); text-align: center; }
.set .alvo { font-weight: 600; font-variant-numeric: tabular-nums; min-width: 0; }
.set .alvo small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.kg { display: flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 8px; padding: 0 8px; background: var(--bg); height: 40px; }
.kg input { width: 100%; border: 0; background: none; font-variant-numeric: tabular-nums; font-weight: 600; font-size: 16px; min-width: 0; outline: none; }
.kg:focus-within { border-color: var(--accent); }
.kg span { color: var(--muted); font-size: 13px; }
.chk { width: 44px; height: 40px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--bg); display: grid; place-items: center; color: var(--muted); }
.set.feito .chk { background: var(--done); border-color: var(--done); color: #fff; }
.set.feito .alvo, .set.feito .n { color: var(--done); }

/* Descanso */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--surface); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); }
.dock-in { max-width: 560px; margin: 0 auto; display: grid; gap: 8px; }
.descanso { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
.relogio { font-family: var(--font-display); font-weight: 700; font-size: 30px; font-variant-numeric: tabular-nums; line-height: 1; }
.descanso.ativo .relogio { color: var(--accent); }
.descanso.fim .relogio { color: var(--done); }

/* Histórico */
.sessao { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.sessao summary { list-style: none; padding: 12px 14px; cursor: pointer; display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; }
.sessao summary::-webkit-details-marker { display: none; }
.sessao .letra { width: 44px; height: 44px; font-size: 22px; border-width: 2px; }
.sessao .corpo { padding: 0 14px 14px; display: grid; gap: 8px; font-size: 14px; }
.sessao .linha { display: grid; grid-template-columns: 1fr auto; gap: 8px; border-top: 1px solid var(--line); padding-top: 8px; }
.sessao .linha span:last-child { font-variant-numeric: tabular-nums; color: var(--muted); text-align: right; }

.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 14px; z-index: 20; max-width: calc(100% - 32px); }
textarea.json { width: 100%; min-height: 120px; font: 12px/1.4 ui-monospace, Menlo, monospace; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
/* Login, sincronização e anotações */
.lembrar { display: flex; align-items: center; gap: 10px; font-size: 14.5px; min-height: 40px; cursor: pointer; }
.lembrar input { width: 20px; height: 20px; accent-color: var(--accent); }
.campo.pin { letter-spacing: .5em; font-variant-numeric: tabular-nums; max-width: 180px; }
.msg-erro { color: var(--warn); font-weight: 600; }
.sync { font-size: 12px; font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--done); }
.sync.salvando::before { background: var(--accent); }
.sync.offline { color: var(--warn); }
.sync.offline::before { background: var(--warn); }
.nota summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13.5px; font-weight: 600; min-height: 32px; }
.nota summary::-webkit-details-marker { display: none; }
.nota[open] summary { color: var(--accent); }
.nota textarea { width: 100%; margin-top: 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); padding: 8px 10px; font-size: 15px; resize: vertical; }
.nota textarea:focus { border-color: var(--accent); outline: none; }
.json-box summary { cursor: pointer; padding: 4px 0; }
.json-box[open] { display: grid; gap: 8px; }
/* Vídeos */
.btn-video { display: inline-flex; align-items: center; gap: 6px; background: var(--accent-soft); color: var(--accent); border: 0; border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: 13.5px; min-height: 36px; justify-self: start; }
.video-box { display: grid; gap: 10px; }
.player { position: relative; width: 100%; aspect-ratio: 16 / 9; max-width: 100%; border-radius: 8px; overflow: hidden; background: #000; }
.player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.video-info { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; font-size: 13.5px; }
.min0 { min-width: 0; }
.link-yt { color: var(--muted); font-size: 13px; text-underline-offset: 3px; }
.linha-video { display: grid; gap: 6px; border-top: 1px solid var(--line); padding-top: 10px; font-size: 14px; }
.linha-video .status { color: var(--ink); font-size: 13px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.linha-video summary { cursor: pointer; }
.campo-url { height: 40px; font-size: 14px; flex: 1 1 200px; }
.campo-texto { width: 100%; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); padding: 10px 12px; font: 14px/1.5 ui-monospace, Menlo, monospace; resize: vertical; }
.campo-texto:focus { border-color: var(--accent); outline: none; }

/* Admin */
.link-admin { background: none; border: 0; color: var(--muted); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; justify-self: start; padding: 4px 0; min-height: 32px; }
.chip.alerta { background: var(--warn); color: var(--surface); }
.treino-card.usuario { grid-template-columns: 44px 1fr auto; }
.treino-card.usuario .letra { width: 44px; height: 44px; font-size: 22px; border-width: 2px; }
.sessao-mini { border-top: 1px solid var(--line); padding-top: 8px; }
.sessao-mini summary { cursor: pointer; display: flex; flex-wrap: wrap; gap: 4px 8px; font-size: 14.5px; }
.sessao-mini .corpo { display: grid; gap: 6px; padding-top: 8px; font-size: 13.5px; }
.sessao-mini .linha { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.sessao-mini .linha span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.linha-nota { display: grid; gap: 2px; font-size: 14px; border-top: 1px solid var(--line); padding-top: 8px; }
.linha-nota span { color: var(--muted); white-space: pre-wrap; }
.painel.perigo { border-color: var(--warn); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<main id="app" aria-live="polite"></main>
<div class="dock" id="dock" hidden></div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="arquivo-pdf" accept="application/pdf,.pdf" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script type="module">
/*PARSER*/

// ---------- armazenamento no aparelho ----------
const PFX = 'ficha:';
const store = {
  get(k, d) { try { const v = localStorage.getItem(PFX + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(PFX + k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(PFX + k); } catch {} },
};

// ---------- login ----------
// auth: { token, nome, slug } — no localStorage com "lembrar de mim", senão só nesta aba.
const AUTH = 'ficha:auth';
function lerAuth() {
  try { return JSON.parse(localStorage.getItem(AUTH) || sessionStorage.getItem(AUTH) || 'null'); } catch { return null; }
}
function gravarAuth(a, lembrar) {
  try { localStorage.removeItem(AUTH); sessionStorage.removeItem(AUTH); } catch {}
  if (!a) return;
  try { (lembrar ? localStorage : sessionStorage).setItem(AUTH, JSON.stringify(a)); } catch {}
}
let auth = lerAuth();
const lembrado = () => { try { return !!localStorage.getItem(AUTH); } catch { return false; } };
let dono = store.get('dono', null);   // { slug, nome }: o aparelho fica preso ao primeiro usuário
let login = { etapa: 'form', erro: '', nome: '', carregando: false };

// ---------- dados do usuário (o "JSON" de cada um) ----------
// ficha: cópia da ficha base, que a pessoa pode trocar pelo PDF dela
let plano = null, fichaEm = 0;
let historico = [];
let ultimas = {};     // cargas usadas, por exercício e série
let notas = {};       // anotações por exercício
let sessao = null, sessaoEm = 0;   // treino em andamento
let descansoSeg = 90;
let repoIgnorado = null;

let rev = 0, sujo = false, sync = 'ok';   // ok | salvando | offline
let carregado = false;
const CACHE = () => `cache:${auth.slug}`;

function coletar() {
  return { ficha: plano, fichaEm, historico, ultimas, notas, sessao, sessaoEm, descanso: descansoSeg, repoIgnorado };
}
function aplicar(d) {
  d = d || {};
  plano = d.ficha || null; fichaEm = d.fichaEm || 0;
  historico = d.historico || []; ultimas = d.ultimas || {}; notas = d.notas || {};
  sessao = d.sessao || null; sessaoEm = d.sessaoEm || 0;
  descansoSeg = d.descanso || 90; repoIgnorado = d.repoIgnorado || null;
}
function guardarCache() { store.set(CACHE(), { rev, sujo, dados: coletar() }); }

// Junta o que está no servidor com o que mudou neste aparelho (ex.: treinou offline no celular
// enquanto o PC tinha uma versão antiga). Histórico soma os dois; o resto fica com o mais novo.
function mesclar(s, l) {
  if (!s) return l;
  const hist = new Map();
  for (const h of [...(s.historico || []), ...(l.historico || [])]) hist.set(h.id || h.fim, h);
  return {
    ficha: (l.fichaEm || 0) >= (s.fichaEm || 0) ? l.ficha : s.ficha,
    fichaEm: Math.max(l.fichaEm || 0, s.fichaEm || 0),
    historico: [...hist.values()].sort((a, b) => b.fim.localeCompare(a.fim)),
    ultimas: { ...s.ultimas, ...l.ultimas },
    notas: { ...s.notas, ...l.notas },
    sessao: (l.sessaoEm || 0) >= (s.sessaoEm || 0) ? l.sessao : s.sessao,
    sessaoEm: Math.max(l.sessaoEm || 0, s.sessaoEm || 0),
    descanso: l.descanso || s.descanso,
    repoIgnorado: l.repoIgnorado || s.repoIgnorado,
  };
}

async function api(rota, opts = {}) {
  const { admin: comoAdmin, ...resto } = opts;
  const token = comoAdmin ? admAuth?.token : auth?.token;
  const r = await fetch(`/api/${rota}`, {
    ...resto,
    headers: { 'content-type': 'application/json', ...(token ? { authorization: `Bearer ${token}` } : {}) },
  });
  const corpo = await r.json().catch(() => ({}));
  if (r.status === 401 && rota !== 'entrar' && rota !== 'admin/entrar') {
    if (comoAdmin) admEncerrar('A sessão do admin expirou. Entre de novo.'); else encerrar('Sua sessão expirou. Entre de novo.');
    throw new Error('sessao');
  }
  return { status: r.status, ...corpo };
}

let timerPush = null;
function salvar(opts = {}) {
  if (opts.sessao) sessaoEm = Date.now();
  if (opts.ficha) fichaEm = Date.now();
  sujo = true;
  guardarCache();
  marcarSync('salvando');
  clearTimeout(timerPush);
  timerPush = setTimeout(enviar, 1200);
}

let enviando = false;
async function enviar() {
  if (!auth || !sujo || enviando) return;
  enviando = true;
  try {
    for (let tentativa = 0; tentativa < 3 && sujo; tentativa++) {
      const enviado = JSON.stringify(coletar());
      const r = await api('dados', { method: 'PUT', body: JSON.stringify({ rev, dados: JSON.parse(enviado) }) });
      if (r.status === 200) {
        rev = r.rev;
        sujo = JSON.stringify(coletar()) !== enviado;   // mudou algo enquanto enviava?
      } else if (r.status === 409) {
        aplicar(mesclar(r.dados, coletar()));
        rev = r.rev;
        if (view.tela !== 'treino') render();
      } else throw new Error(r.mensagem || 'erro');
    }
    guardarCache();
    marcarSync(sujo ? 'salvando' : 'ok');
    if (sujo) timerPush = setTimeout(enviar, 1200);
  } catch (e) {
    if (e.message !== 'sessao') marcarSync('offline');
  } finally {
    enviando = false;
  }
}

// Busca a versão do servidor (ao abrir o app e ao voltar para ele).
async function puxar() {
  if (!auth) return;
  try {
    if (sujo) return enviar();
    const r = await api('dados');
    if (r.status !== 200) throw new Error();
    if (r.rev !== rev || !carregado) {
      const antes = JSON.stringify(coletar());
      rev = r.rev;
      aplicar(r.dados);
      carregado = true;
      guardarCache();
      if (JSON.stringify(coletar()) !== antes && !document.activeElement?.matches('input, textarea')) render();
    }
    await fichaBase();
    marcarSync('ok');
  } catch (e) {
    if (e.message !== 'sessao') { marcarSync('offline'); if (!carregado) render(); }
  }
}

// Ficha base do repositório (docs/treino.json): quem ainda não tem ficha recebe uma cópia,
// e quem segue a do repo é avisado quando ela muda.
async function fichaBase() {
  try {
    const r = await fetch('treino.json', { cache: 'no-store' });
    if (!r.ok) return;
    const base = { ...(await r.json()), origem: 'repo' };
    if (!plano) { plano = base; salvar({ ficha: true }); render(); }
    else if (plano.origem === 'repo' && base.importadoEm !== plano.importadoEm && repoIgnorado !== base.importadoEm && !pendente) { pendente = base; if (view.tela === 'home') render(); }
  } catch {}
}

function marcarSync(estado) {
  sync = estado;
  const el = document.getElementById('sync');
  if (el) { el.className = `sync ${sync}`; el.textContent = TEXTO_SYNC[sync]; }
}
const TEXTO_SYNC = { ok: 'Salvo', salvando: 'Salvando…', offline: 'Sem conexão · salvo no aparelho' };

function encerrar(msg) {
  auth = null; gravarAuth(null);
  aplicar(null); rev = 0; sujo = false; carregado = false;
  fimDescanso = 0; clearInterval(tick); telaLigada(false);
  login = { etapa: 'form', erro: msg || '', nome: dono?.nome || '', carregando: false };
  view = { tela: 'home' };
  render();
}

async function entrar(nome, pin, lembrar, criar) {
  login = { ...login, nome, carregando: true, erro: '' };
  render();
  let r;
  try {
    r = await api('entrar', { method: 'POST', body: JSON.stringify({ nome, pin, lembrar, criar }) });
  } catch {
    login = { ...login, carregando: false, erro: 'Sem conexão. Para entrar a primeira vez neste aparelho você precisa de internet.' };
    return render();
  }
  if (r.erro === 'nao-existe') { login = { etapa: 'criar', nome, pin, lembrar, erro: '', carregando: false }; return render(); }
  if (r.status !== 200 || !r.token) {
    // Sem "erro" no corpo, quem respondeu não foi a API (deploy sem a pasta functions/ ou ainda publicando).
    const msg = r.erro ? r.mensagem : `O servidor do app não respondeu (código ${r.status}). A API ainda não está publicada; confira o deploy no Cloudflare.`;
    login = { ...login, etapa: 'form', carregando: false, erro: msg || 'Não consegui entrar.' };
    return render();
  }

  auth = { token: r.token, nome: r.nome, slug: r.slug };
  gravarAuth(auth, lembrar);
  if (!dono) { dono = { slug: r.slug, nome: r.nome }; store.set('dono', dono); }

  // Se este aparelho tem treino feito offline ainda não enviado, junta com o do servidor.
  const cache = store.get(CACHE(), null);
  rev = r.rev;
  aplicar(cache?.sujo ? mesclar(r.dados, cache.dados) : r.dados);
  sujo = !!cache?.sujo;
  carregado = true;
  guardarCache();
  login = { etapa: 'form', erro: '', nome: '', carregando: false };
  view = { tela: 'home' };
  if (sessao && treino(sessao.treinoId) && contagem(treino(sessao.treinoId)).ok > 0) view = { tela: 'treino', id: sessao.treinoId };
  render();
  window.scrollTo({ top: 0 });
  if (sujo) enviar();
  await fichaBase();
}

const treino = (id) => plano?.treinos.find((t) => t.id === id);
function ultimoDe(id) { return historico.find((h) => h.treinoId === id); }
function proximoId() {
  if (!plano) return null;
  const ult = historico[0];
  if (!ult) return plano.treinos[0].id;
  const i = plano.treinos.findIndex((t) => t.id === ult.treinoId);
  return plano.treinos[(i + 1) % plano.treinos.length].id;
}
// Cargas e anotações por treino + nome (+ ocorrência), já que o mesmo exercício
// pode aparecer em treinos diferentes com cargas diferentes.
function chaveEx(ex) {
  const t = plano.treinos.find((t) => t.exercicios.includes(ex));
  const iguais = t.exercicios.filter((e) => norm(e.nome) === norm(ex.nome));
  return `${t.id}|${norm(ex.nome)}|${iguais.indexOf(ex)}`;
}
function cargaInicial(ex, i) {
  const s = sessao?.cargas?.[ex.id]?.[i];
  if (s !== undefined) return s;
  const u = ultimas[chaveEx(ex)]?.[i];
  if (u) return u;
  return ex.sets[i]?.carga || '';
}
const feito = (ex, i) => !!sessao?.feitos?.[ex.id]?.[i];
function contagem(t) {
  let total = 0, ok = 0;
  for (const ex of t.exercicios) ex.sets.forEach((_, i) => { total++; if (feito(ex, i)) ok++; });
  return { total, ok };
}

// ---------- descanso ----------
let fimDescanso = 0, tick = null;
function renderDock(oculto) {
  if (oculto || view.tela !== 'treino') { $dock.hidden = true; return; }
  $dock.hidden = false;
  const rest = Math.ceil((fimDescanso - Date.now()) / 1000);
  const ativo = fimDescanso && rest > 0;
  const acabou = fimDescanso && rest <= 0;
  $dock.innerHTML = `<div class="dock-in">
    <div class="descanso ${ativo ? 'ativo' : acabou ? 'fim' : ''}">
      <div><div class="eyebrow">${ativo ? 'Descanso' : acabou ? 'Bora, próxima série' : 'Descanso entre séries'}</div>
        <div class="relogio" id="relogio">${ativo ? mmss(rest) : mmss(descansoSeg)}</div></div>
      <div class="row">
        ${ativo ? `<button class="btn small" data-a="desc-mais">+15s</button><button class="btn small" data-a="desc-parar">Pular</button>`
          : `<button class="btn small" data-a="desc-tempo" aria-label="Mudar tempo de descanso">${descansoSeg}s</button><button class="btn small primary" data-a="desc-iniciar">Iniciar</button>`}
      </div>
    </div></div>`;
}
function iniciarDescanso() {
  fimDescanso = Date.now() + descansoSeg * 1000;
  clearInterval(tick);
  tick = setInterval(() => {
    const rest = Math.ceil((fimDescanso - Date.now()) / 1000);
    const el = document.getElementById('relogio');
    if (rest <= 0) {
      clearInterval(tick);
      try { navigator.vibrate?.([200, 100, 200]); } catch {}
      bip();
      renderDock();
    } else if (el) el.textContent = mmss(rest);
  }, 250);
  renderDock();
}
let audio;
function bip() {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = 880; g.gain.value = 0.15;
    o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime + 0.35);
  } catch {}
}

// mantém a tela ligada durante o treino quando o navegador deixa
let wake = null;
async function telaLigada(on) {
  try {
    if (on && !wake && navigator.wakeLock) wake = await navigator.wakeLock.request('screen');
    if (!on && wake) { await wake.release(); wake = null; }
  } catch { wake = null; }
}

const buscaYoutube = (nome) => `https://www.youtube.com/results?search_query=${encodeURIComponent(nome + ' execução')}`;

function videoBloco(ex) {
  if (!(ex.id in videoAberto)) return `<button class="btn-video" data-a="video" data-ex="${ex.id}">${ICON.play} Ver execução</button>`;
  const c = videoCache[norm(ex.nome)];
  const est = videoEstado[ex.id];
  let corpo;
  if (est === 'carregando') corpo = '<p class="muted">Procurando o vídeo…</p>';
  else if (est) corpo = `<p class="msg-erro">${esc(est)}</p>`;
  else if (!c) corpo = '';
  else if (!c.videos.length) corpo = '<p class="muted">Não achei um vídeo desse exercício. Tente "Procurar no YouTube".</p>';
  else {
    const i = videoAberto[ex.id] % c.videos.length, v = c.videos[i];
    corpo = `<div class="player"><iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(v.id)}?rel=0&playsinline=1" title="${esc(v.titulo)}"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>
      <div class="video-info"><span class="min0"><b>${esc(v.titulo)}</b><br><span class="muted">${esc(v.canal)}${c.fixo && i === 0 ? ' · escolhido pelo admin' : ''}</span></span>
        ${c.videos.length > 1 ? `<button class="btn small" data-a="video-outro" data-ex="${ex.id}">Outro vídeo (${i + 1}/${c.videos.length})</button>` : ''}</div>`;
  }
  return `<div class="video-box">${corpo}
    <div class="row"><button class="btn small ghost" data-a="video-fechar" data-ex="${ex.id}">Fechar vídeo</button>
    <a class="link-yt" href="${buscaYoutube(ex.nome)}" target="_blank" rel="noopener">Procurar no YouTube</a></div></div>`;
}
function exPorId(id) { for (const t of plano?.treinos || []) for (const e of t.exercicios) if (e.id === id) return e; return null; }
function atualizarVideo(exId) {
  const el = document.getElementById(`video-${exId}`), ex = exPorId(exId);
  if (el && ex) el.innerHTML = videoBloco(ex);
}
async function abrirVideo(exId) {
  const ex = exPorId(exId);
  if (!ex) return;
  videoAberto[exId] = 0;
  const k = norm(ex.nome), c = videoCache[k];
  const velho = !c || !c.videos.length || Date.now() - (c.em || 0) > 86400000;
  if (!velho) return atualizarVideo(exId);
  videoEstado[exId] = c ? null : 'carregando';
  atualizarVideo(exId);
  try {
    const r = await api(`video?nome=${encodeURIComponent(ex.nome)}`);
    if (r.status !== 200) throw new Error(r.mensagem || 'Não consegui buscar o vídeo agora.');
    videoCache[k] = { videos: r.videos, fixo: r.fixo, em: Date.now() };
    // só guarda no aparelho quando achou vídeo; "nada encontrado" é perguntado de novo da próxima vez
    if (r.videos.length) store.set('videos', Object.fromEntries(Object.entries(videoCache).filter(([, v]) => v.videos.length)));
    videoEstado[exId] = null;
  } catch (e) {
    if (e.message === 'sessao') return;
    videoEstado[exId] = c ? null : (e.message === 'Failed to fetch' ? 'Sem conexão para buscar o vídeo.' : e.message);
  }
  atualizarVideo(exId);
}

function sairModoAdmin() {
  modoAdmin = false;

}
function admEncerrar(msg) {
  admAuth = null;
  try { localStorage.removeItem(ADM_AUTH); sessionStorage.removeItem(ADM_AUTH); } catch {}
  admLogin = { erro: msg || '', carregando: false };
  adm = { ...adm, lista: null, det: null };
  view = { tela: 'admin' };
  render();
}
async function admEntrar(senha, lembrar) {
  admLogin = { erro: '', carregando: true };
  render();
  let r;
  try { r = await api('admin/entrar', { method: 'POST', body: JSON.stringify({ senha, lembrar }) }); }
  catch { admLogin = { erro: 'Sem conexão.', carregando: false }; return render(); }
  if (r.status !== 200 || !r.token) {
    admLogin = { erro: r.erro ? r.mensagem : `O servidor não respondeu (código ${r.status}).`, carregando: false };
    return render();
  }
  admAuth = { token: r.token };
  try { (lembrar ? localStorage : sessionStorage).setItem(ADM_AUTH, JSON.stringify(admAuth)); } catch {}
  admLogin = { erro: '', carregando: false };
  view = { tela: 'admin' };
  admCarregarLista();
}
async function admSair() {
  try { await api('sair', { method: 'POST', admin: true }); } catch {}
  admEncerrar();
  sairModoAdmin();
}

async function admAcao(slug, acao, metodo, corpo, okMsg) {
  try {
    const r = await api(`admin/usuarios/${slug}${acao ? '/' + acao : ''}`, { method: metodo, body: corpo ? JSON.stringify(corpo) : undefined, admin: true });
    if (r.status !== 200) throw new Error(r.mensagem || 'Não deu certo.');
    toast(typeof okMsg === 'function' ? okMsg(r) : okMsg);
    return r;
  } catch (e) {
    if (e.message !== 'sessao') toast(e.message);
    return null;
  }
}

const quando = (iso) => {

  return dias <= 0 ? 'hoje' : dias === 1 ? 'ontem' : `há ${dias} dias`;
};

function finalizar() {
  const t = treino(sessao.treinoId);
  const entrada = {
    id: novoId(), treinoId: t.id, titulo: t.titulo, inicio: sessao.inicio, fim: new Date().toISOString(),
    exercicios: t.exercicios.map((ex) => ({
      nome: ex.nome,
      sets: ex.sets.map((s, i) => ({ alvo: s.reps, carga: String(cargaInicial(ex, i) || ''), feito: feito(ex, i) })),
    })).filter((e) => e.sets.some((s) => s.feito)),
  };
  for (const ex of t.exercicios) {
    const usadas = ex.sets.map((_, i) => (feito(ex, i) ? String(cargaInicial(ex, i) || '') : ultimas[chaveEx(ex)]?.[i] || ''));
    if (usadas.some(Boolean)) ultimas[chaveEx(ex)] = usadas;
  }
  historico.unshift(entrada);
  sessao = null;
  salvar({ sessao: true });
  fimDescanso = 0; clearInterval(tick); telaLigada(false);
  view = { tela: 'home' };
  render();
  toast(`Treino ${t.id} salvo no histórico`);
}

async function lerPdf(file) {
  erroImport = ''; pendente = null;
  try {
    if (!window.pdfjsLib) throw new Error('Não consegui carregar o leitor de PDF. Confira a internet e tente de novo.');
    const bytes = new Uint8Array(await file.arrayBuffer());
    pendente = await parseMfitPdf(window.pdfjsLib, bytes);
  } catch (e) {
    erroImport = e.message || 'Não consegui ler esse PDF.';
  }
  view = { tela: 'home' };
  render();
  window.scrollTo({ top: 0 });
}

  if (a === 'corrigir-nome') { login = { etapa: 'form', nome: login.nome, erro: '' }; render(); }
  else if (a === 'sair') sair();
  else if (a === 'desvincular') {
    if (!b.dataset.sure) { b.dataset.sure = '1'; b.textContent = 'Toque de novo para liberar'; return; }
    store.del('dono'); store.del(CACHE()); dono = null; sair();
  }
  else if (a === 'video') abrirVideo(b.dataset.ex);
  else if (a === 'video-fechar') { delete videoAberto[b.dataset.ex]; videoEstado[b.dataset.ex] = null; atualizarVideo(b.dataset.ex); }
  else if (a === 'video-outro') { videoAberto[b.dataset.ex]++; atualizarVideo(b.dataset.ex); }
  else if (a === 'adm-videos') { view = { tela: 'admin-videos' }; window.scrollTo({ top: 0 }); admCarregarVideos(); }
  else if (a === 'adm-desfixar' || a === 'adm-rebuscar') {
    const nome = b.dataset.nome;
    try {
      const r = a === 'adm-desfixar'
        ? await api('admin/video', { method: 'PUT', body: JSON.stringify({ nome, url: '' }), admin: true })
        : await api(`admin/video?nome=${encodeURIComponent(nome)}`, { method: 'DELETE', admin: true });
      if (r.status !== 200) throw new Error(r.mensagem || 'Não deu certo.');
      toast(a === 'adm-desfixar' ? 'Vídeo desfixado' : 'Será buscado de novo na próxima vez');
      admCarregarVideos();
    } catch (e) { if (e.message !== 'sessao') toast(e.message); }
  }
  else if (a === 'modo-admin') entrarModoAdmin();
  else if (a === 'sair-modo-admin') sairModoAdmin();
  else if (a === 'adm-sair') admSair();
  else if (a === 'admin') { view = { tela: 'admin' }; render(); window.scrollTo({ top: 0 }); admCarregarLista(); }
  else if (a === 'adm-atualizar') admCarregarLista();
  else if (a === 'adm-abrir') { view = { tela: 'admin-usuario', slug: b.dataset.slug }; adm.det = null; render(); window.scrollTo({ top: 0 }); admCarregarUsuario(b.dataset.slug); }
  else if (a === 'adm-ficha-base') {
    if (!b.dataset.sure) { b.dataset.sure = '1'; b.textContent = 'Toque de novo para enviar'; return; }
    try {
      const r = await fetch('treino.json', { cache: 'no-store' });
      if (!r.ok) throw new Error();
      admEnviarFicha(b.dataset.slug, { ...(await r.json()), origem: 'repo' }, 'base');
    } catch { toast('Não consegui ler a ficha base (treino.json).'); }
  }
  else if (a === 'adm-ficha-pdf') { adm.pdfPara = b.dataset.slug; document.getElementById('arquivo-pdf').click(); }
  else if (a === 'adm-desbloquear') { if (await admAcao(b.dataset.slug, 'desbloquear', 'POST', null, 'Desbloqueado')) admCarregarUsuario(b.dataset.slug); }
  else if (a === 'adm-desconectar') {
    if (!b.dataset.sure) { b.dataset.sure = '1'; b.textContent = 'Toque de novo para desconectar'; return; }
    if (await admAcao(b.dataset.slug, 'desconectar', 'POST', null, (r) => `${r.desconectados} ${r.desconectados === 1 ? 'aparelho desconectado' : 'aparelhos desconectados'}`)) admCarregarUsuario(b.dataset.slug);
  }
  else if (a === 'adm-excluir') {
    if (!b.dataset.sure) { b.dataset.sure = '1'; b.textContent = 'Toque de novo para excluir de vez'; return; }
    if (await admAcao(b.dataset.slug, '', 'DELETE', null, 'Usuário excluído')) { view = { tela: 'admin' }; adm.det = null; admCarregarLista(); }
  }
  else if (a === 'carregar') { adm.pdfPara = null; document.getElementById('arquivo-pdf').click(); }
  else if (a === 'confirmar-import') {
    plano = pendente; pendente = null;
    if (sessao && !treino(sessao.treinoId)) sessao = null;
    salvar({ ficha: true, sessao: true });
    render(); toast('Ficha atualizada');
  } else if (a === 'cancelar-import') {
    if (pendente?.origem === 'repo') { repoIgnorado = pendente.importadoEm; salvar(); }
    pendente = null; erroImport = ''; render();
  }
  else if (a === 'abrir') { view = { tela: 'treino', id: b.dataset.id }; render(); window.scrollTo({ top: 0 }); telaLigada(true); }
  else if (a === 'home') { view = { tela: 'home' }; telaLigada(false); render(); window.scrollTo({ top: 0 }); }
  else if (a === 'historico') { view = { tela: 'historico' }; render(); window.scrollTo({ top: 0 }); }
  else if (a === 'dados') { view = { tela: 'home', dados: !view.dados }; render(); }
  else if (a === 'copiar-json') {
    const ta = document.getElementById('json-ficha');
    try { await navigator.clipboard.writeText(ta.value); toast('JSON copiado'); }
    catch { ta.select(); toast('Selecionei o texto, é só copiar'); }
  } else if (a === 'baixar-json') {
    const url = URL.createObjectURL(new Blob([JSON.stringify(plano, null, 2)], { type: 'application/json' }));
    const l = Object.assign(document.createElement('a'), { href: url, download: 'treino.json' });
    l.click(); setTimeout(() => URL.revokeObjectURL(url), 1000);
  } else if (a === 'set') {
    const { ex, i } = b.dataset;
    sessao.feitos[ex] = sessao.feitos[ex] || [];
    const agora = !sessao.feitos[ex][i];
    sessao.feitos[ex][i] = agora;
    // guarda a carga que está no campo no momento da marcação
    const inp = document.getElementById(`kg-${ex}-${i}`);
    sessao.cargas[ex] = sessao.cargas[ex] || [];
    sessao.cargas[ex][i] = inp.value.trim().replace(',', '.');
    salvar({ sessao: true });
    const y = window.scrollY;
    view.confirmaFim = false;
    render(); window.scrollTo({ top: y });
    if (agora) iniciarDescanso();
  } else if (a === 'finalizar') {
    const { ok, total } = contagem(treino(sessao.treinoId));
    if (!ok) { toast('Marque pelo menos uma série antes de finalizar'); return; }
    if (ok < total && !b.dataset.confirma) { view.confirmaFim = true; render(); return; }
    finalizar();
  } else if (a === 'cancelar-fim') { view.confirmaFim = false; render(); }
  else if (a === 'descartar') {
    if (!b.dataset.sure) { b.dataset.sure = '1'; b.textContent = 'Toque de novo para descartar'; return; }
    sessao = null; salvar({ sessao: true }); fimDescanso = 0; clearInterval(tick);
    view = { tela: 'treino', id: b.dataset.id }; render(); toast('Séries descartadas');
  }
});

$app.addEventListener('submit', (ev) => {
  ev.preventDefault();
  if (ev.target.id === 'form-canais') {
    const entradas = document.getElementById('canais').value.split('\n').map((x) => x.trim()).filter(Boolean);
    admVid.salvando = true; render();
    api('admin/canais', { method: 'PUT', body: JSON.stringify({ entradas }), admin: true })
      .then((r) => {
        admVid.salvando = false;
        if (r.status !== 200) { admVid.erro = r.mensagem || 'Não consegui salvar os canais.'; return render(); }
        toast(r.canais.length ? `${r.canais.length} ${r.canais.length === 1 ? 'canal salvo' : 'canais salvos'}` : 'Buscando no YouTube todo');
        admCarregarVideos();
      })
      .catch((e) => { admVid.salvando = false; if (e.message !== 'sessao') { admVid.erro = 'Sem conexão.'; render(); } });
    return;
  }
  if (ev.target.classList.contains('form-fixar')) {
    const url = ev.target.querySelector('input').value.trim();
    if (!url) { toast('Cole o link do vídeo.'); return; }
    api('admin/video', { method: 'PUT', body: JSON.stringify({ nome: ev.target.dataset.nome, url }), admin: true })
      .then((r) => { if (r.status !== 200) return toast(r.mensagem || 'Não deu certo.'); toast('Vídeo fixado'); admCarregarVideos(); })
      .catch((e) => { if (e.message !== 'sessao') toast('Sem conexão.'); });
    return;
  }
  if (ev.target.id === 'form-admin') {
    const senha = document.getElementById('adm-senha').value;
    if (!senha) { admLogin.erro = 'Digite a senha.'; return render(); }
    admEntrar(senha, document.getElementById('lembrar-adm').checked);
  } else if (ev.target.id === 'form-entrar') {
    const nome = document.getElementById('nome-login').value.trim();
    const pin = document.getElementById('pin-login').value.trim();
    const lembrar = document.getElementById('lembrar').checked;
    if (!nome) { login.erro = 'Digite seu nome.'; return render(); }
    if (ehNomeAdmin(nome)) {   // "admin" no nome: o campo do PIN vira a senha do admin
      if (!pin) { login = { ...login, nome, erro: 'Digite a senha do admin.' }; return render(); }
      login = { etapa: 'form', erro: '', nome: '', carregando: false };
      modoAdmin = true; history.replaceState(null, '', '#admin');
      return admEntrar(pin, lembrar);
    }
    if (!/^\d{4}$/.test(pin)) { login = { ...login, nome, erro: 'O PIN tem 4 números.' }; return render(); }
    entrar(nome, pin, lembrar, false);
  } else if (ev.target.id === 'form-adm-pin') {
    const pin = document.getElementById('adm-pin').value.trim();
    if (!/^\d{4}$/.test(pin)) { toast('O PIN tem 4 números.'); return; }
    const slug = ev.target.dataset.slug;
    admAcao(slug, 'pin', 'POST', { pin }, (r) => `PIN trocado${r.desconectados ? ` · ${r.desconectados} ${r.desconectados === 1 ? 'aparelho desconectado' : 'aparelhos desconectados'}` : ''}`)
      .then((r) => { if (r) admCarregarUsuario(slug); });
  } else if (ev.target.id === 'form-criar') {
    const pin2 = document.getElementById('pin-confirma').value.trim();
    if (pin2 !== login.pin) { login.erro = 'Os PINs não batem. Digite o mesmo PIN de antes.'; return render(); }
    entrar(login.nome, login.pin, login.lembrar, true);
  }
});

const ehNomeAdmin = (n) => n.trim().toLowerCase() === 'admin';
function ajustarCampoSenha() {
  const nome = document.getElementById('nome-login'), pin = document.getElementById('pin-login');
  if (!nome || !pin || nome.type === 'hidden') return;
  const adminAqui = ehNomeAdmin(nome.value);
  if (adminAqui) { pin.removeAttribute('maxlength'); pin.removeAttribute('pattern'); pin.setAttribute('inputmode', 'text'); pin.placeholder = 'Senha do admin'; pin.classList.remove('pin'); }
  else { pin.setAttribute('maxlength', '4'); pin.setAttribute('pattern', '[0-9]*'); pin.setAttribute('inputmode', 'numeric'); pin.placeholder = '••••'; pin.classList.add('pin'); }
  document.querySelector('label[for="pin-login"]').textContent = adminAqui ? 'Senha' : 'PIN';
}

let timerNota = null;
$app.addEventListener('input', (ev) => {
  if (ev.target.id === 'nome-login') return ajustarCampoSenha();
  const nota = ev.target.closest('textarea[data-nota]');
  if (nota) {
    const v = nota.value.trim();
    if (v) notas[nota.dataset.nota] = nota.value; else delete notas[nota.dataset.nota];
    clearTimeout(timerNota); timerNota = setTimeout(() => salvar(), 400);
    return;
  }
  const inp = ev.target.closest('input[data-ex]');
  if (!inp || !sessao) return;
  const { ex, i } = inp.dataset;
  sessao.cargas[ex] = sessao.cargas[ex] || [];
  sessao.cargas[ex][i] = inp.value.trim().replace(',', '.');
  salvar({ sessao: true });
});

$dock.addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-a]');
  if (!b) return;
  const a = b.dataset.a;
  if (a === 'desc-iniciar') iniciarDescanso();
  else if (a === 'desc-parar') { fimDescanso = 0; clearInterval(tick); renderDock(); }
  else if (a === 'desc-mais') { fimDescanso += 15000; }
  else if (a === 'desc-tempo') {
    const op = [60, 90, 120, 180];
    descansoSeg = op[(op.indexOf(descansoSeg) + 1) % op.length];
    salvar(); renderDock();
  }
});

document.getElementById('arquivo-pdf').addEventListener('change', (ev) => {
  const f = ev.target.files[0];
  ev.target.value = '';
  if (!f) return;
  if (adm.pdfPara) {
    const slug = adm.pdfPara; adm.pdfPara = null;
    if (!window.pdfjsLib) { toast('Não consegui carregar o leitor de PDF.'); return; }
    toast('Lendo o PDF…');
    f.arrayBuffer().then((buf) => parseMfitPdf(window.pdfjsLib, new Uint8Array(buf)))
      .then((ficha) => admEnviarFicha(slug, ficha, 'do PDF'))
      .catch((e) => toast(e.message || 'Não consegui ler esse PDF.'));
    return;
  }
  lerPdf(f);
});

// sincroniza ao voltar para o app e quando a internet volta
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') puxar(); });
window.addEventListener('online', () => (sujo ? enviar() : puxar()));
setInterval(() => { if (sujo && !enviando) enviar(); }, 30000);

window.addEventListener('hashchange', () => {
  const quer = location.hash === '#admin';
  if (quer !== modoAdmin) (quer ? entrarModoAdmin() : sairModoAdmin());
});

// ---------- início ----------
function iniciar() {
  if (auth) {
    const cache = store.get(CACHE(), null);
    if (cache) {
      rev = cache.rev; sujo = cache.sujo; aplicar(cache.dados); carregado = true;
      if (sujo) sync = 'salvando';
      if (sessao && treino(sessao.treinoId) && contagem(treino(sessao.treinoId)).ok > 0) view = { tela: 'treino', id: sessao.treinoId };
    }
  } else {
    login.nome = dono?.nome || '';
  }
  if (modoAdmin) view = { tela: 'admin' };
  render();
  if (auth) puxar();
  if (modoAdmin && admAuth) admCarregarLista();
}
iniciar();
</script>
